name: Zbuduj APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Budowanie
        run: gradle assembleDebug --no-daemon

      - name: Zmiana nazwy pliku
        run: cp app/build/outputs/apk/debug/app-debug.apk myTram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: myTram-APK
          path: myTram.apk

      # Stały link do najnowszego APK: .../releases/latest/download/myTram.apk
      - name: Wydanie z najnowszym APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" myTram.apk \
            --title "myTram $TAG" \
            --notes "APK zbudowane automatycznie z commita ${GITHUB_SHA::7}." \
            --latest
